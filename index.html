    <style>
        :root {
            --bg-color: #09090b;
            --surface-color: rgba(9, 9, 11, 0.8);
            --surface-light: rgba(9, 9, 11, 0.5);
            --text-main: #fafafa;
            --text-muted: #a1a1aa;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --border: #27272a;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image:
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15), transparent 25%);
        }

        .container {
            background: var(--surface-color);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
            z-index: 10;
        }

        .dashboard-container {
            max-width: 900px;
            padding: 30px;
        }

        h2 {
            margin-top: 0;
            font-size: 24px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
        }

        input[type="text"],
        input[type="password"],
        input[type="file"] {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .checkbox-group input[type="checkbox"] {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid #3f3f46;
            border-radius: 50%;
            outline: none;
            cursor: pointer;
            position: relative;
            background: rgba(255,255,255,0.05);
            transition: all 0.2s;
        }

        .checkbox-group input[type="checkbox"]:checked {
            background: var(--text-main);
            border-color: var(--text-main);
        }

        .checkbox-group input[type="checkbox"]:checked::after {
            content: '\2713';
            font-size: 13px;
            color: #000;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-weight: 800;
        }

        .checkbox-group label {
            margin: 0;
            font-size: 14px;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .toggle-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: var(--text-muted);
            cursor: pointer;
        }

        .toggle-link span {
            transition: color 0.2s;
        }

        .toggle-link:hover span {
            color: #fff !important;
        }

            gap: 30px;

            padding: 0;
            transition: all 0.2s;

        .icon-btn:hover { background: var(--primary); }

        #toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10000;

        .toast {
            background: rgba(24, 24, 27, 0.95);
            border: 1px solid #3f3f46;
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: 8px;

        .toast.show {
            transform: translateX(0);
        }

        .toast.error { border-left: 4px solid #ef4444; }
        .toast.success { border-left: 4px solid #22c55e; }

        .toast i { font-size: 18px; }
        .toast.error i { color: #ef4444; }
        .toast.success i { color: #22c55e; }

        #loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: var(--primary);

        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;

        .container {
            z-index: 10;

        .animated-field {
            position: relative;
            border-radius: 0.5rem;
            border: 1px solid var(--border);
            background: var(--bg-color);
            transition: all 0.3s ease-in-out;
            overflow: hidden;
            margin-bottom: 1.5rem;

        .animated-field:focus-within {
            border-color: #52525b;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.1);

            position: absolute;
            left: 1rem;
            top: 50%;

            transition: color 0.2s;
            font-size: 1.125rem;
            pointer-events: none;
            z-index: 2;

        .animated-field:focus-within i.icon {
            color: var(--text-main);

        .animated-field input[type="text"],

        .animated-field .hover-glow {

            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1;
        }
        .animated-field:hover .hover-glow {
            opacity: 1;
        }

        .auth-btn {
            position: relative;
            width: 100%;
            padding: 0.875rem 1rem;
            border-radius: 0.5rem;

        .social-btn {
            position: relative;

            display: flex;

        .social-btn:hover {
            border-color: #3f3f46;

            background: rgba(255,255,255,0.05);

        .social-btn::before {
            content: '';
            position: absolute;

            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            transition: transform 0.5s ease;
            z-index: 1;
        }
        .social-btn:hover::before {
            transform: translateX(0);
        }
        .social-btn i {
            position: relative;
            z-index: 2;
            font-size: 1.25rem;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);

            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;

            overflow-y: auto;

        .modal-overlay.active .modal-content {

            justify-content: space-between;

            border-bottom: 1px solid var(--border);
        }
        .version-item:last-child { border-bottom: none; }
        .version-name { font-size: 14px; font-weight: 500; }
        .version-dl {
            background: rgba(59, 130, 246, 0.1);

            transition: all 0.2s;
        }
        .version-dl:hover { background: var(--primary); color: white; }
